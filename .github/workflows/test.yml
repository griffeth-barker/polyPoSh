name: Test PowerShell Installation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test on ${{ matrix.distro }} (x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:22.04
          - ubuntu:20.04
          - debian:12
          - debian:11
          - fedora:40
          - fedora:39
          - rockylinux:9
          - almalinux:9
          - opensuse/leap:15.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run polypo.sh in ${{ matrix.distro }} container
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --volume "${{ github.workspace }}/polypo.sh:/polypo.sh:ro" \
            "${{ matrix.distro }}" \
            bash -c "bash /polypo.sh && pwsh --version"

  test-arm64:
    name: Test on ${{ matrix.distro }} (aarch64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:22.04
          - debian:12
          - fedora:40
          - rockylinux:9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run polypo.sh in ${{ matrix.distro }} container (aarch64)
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}/polypo.sh:/polypo.sh:ro" \
            "${{ matrix.distro }}" \
            bash -c "bash /polypo.sh && pwsh --version"
